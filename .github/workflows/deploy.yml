name: Deploy Backend

run-name: Deploy Backend

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/uat_salon_backend_apis/UAT_SALON_SERVICES
            git pull origin uat
            npm install
            npx sequelize-cli db:migrate --env uat
            pm2 restart UAT_SALON_API --update-env
